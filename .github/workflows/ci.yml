name: Rust checks
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: python3 scripts/audit-sculptgl-inventory.py --check
      - run: cargo test --locked -p obrush-core
      # Keep upstream vendored code outside the workspace lint policy.
      - run: cargo clippy --locked -p obrush-core --all-targets --no-deps -- -D warnings
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets --no-deps -- -D warnings
      - run: cargo check --locked -p obrush-app --target wasm32-unknown-unknown
      - run: cargo check --locked -p obrush-gpu --target wasm32-unknown-unknown
      - run: cargo clippy --locked --workspace --lib --target wasm32-unknown-unknown --no-deps -- -D warnings
      - run: cargo clippy --locked --workspace --lib --target wasm32-unknown-unknown --features obrush-core/wasm-simd-fingerprint --no-deps -- -D warnings
