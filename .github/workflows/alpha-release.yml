name: Draft macOS alpha release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify Apple Silicon runner and matching tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(uname -m)" = arm64
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          git diff --quiet HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
      - name: Build and verify macOS app
        run: scripts/package-macos.sh
      - name: Assemble versioned archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: scripts/assemble-alpha-macos.sh "$RELEASE_TAG"
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obrush-${{ github.ref_name }}-macos-arm64
          path: |
            .artifacts/release/*.zip
            .artifacts/release/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Create a draft release for human review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            ".artifacts/release/OBRush-$RELEASE_TAG-macos-arm64.zip" \
            .artifacts/release/SHA256SUMS.txt \
            --draft --verify-tag \
            --title "OBRush $RELEASE_TAG public alpha" \
            --notes-file .github/ALPHA_RELEASE_NOTES.md
