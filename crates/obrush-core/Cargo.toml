[package]
name = "obrush-core"
version.workspace = true
edition = "2021"
description = "Portable mesh, sculpting, and project engine for OBrush"
license = "MIT"

[features]
wasm-simd-fingerprint = ["blake3/wasm32_simd"]

[dependencies]
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
png = "=0.18.1"
libm = { version = "=0.2.16", default-features = false }
sha2 = "=0.10.9"
blake3 = "=1.8.7"
web-time = "=1.1.0"
base64 = "=0.22.1"
