[workspace]
members = ["crates/obrush-core", "crates/obrush-app", "crates/obrush-gpu"]
resolver = "2"

[workspace.package]
version = "0.1.20"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
glam = { version = "0.30", features = ["serde", "bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
bytemuck = { version = "1", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_glow = "=0.33.3"

[profile.release]
opt-level = 2

[profile.web-release]
inherits = "release"
opt-level = 3
lto = "thin"
strip = true
